name: Offline Windows
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - run: npm ci
      - run: npx playwright install chromium
      # Includes a separate serial Stop timing gate; full-suite no-new-POST assertions stay active.
      - run: node --import tsx scripts/ci-check.ts
        env:
          JOBHUNTER_TEST_DIAGNOSTICS_DIR: ${{ runner.temp }}/jobhunter-synthetic-diagnostics
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: offline-backend-${{ matrix.os }}
          path: ${{ runner.temp }}/jobhunter-synthetic-diagnostics/*.json
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: offline-ui-${{ matrix.os }}
          path: |
            playwright-report/index.html
            test-results/**/*.png
          retention-days: 3
          if-no-files-found: ignore
